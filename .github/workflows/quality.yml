name: quality

on:
  workflow_dispatch:
    inputs:
      run_models:
        description: Run Docling/OCR model test
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "20 18 * * 5"

jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/quality -q -m "not needs_model and not slow"

  models:
    if: github.event_name == 'workflow_dispatch' && inputs.run_models
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/docling
            ~/.cache/pdf2read
          key: docling-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - run: python -m pip install -e ".[dev,quality]"
      - run: python -m pytest tests/quality/test_docling_optional.py -q -m needs_model

[project]
name = "pdf2read"
version = "0.1.0"
description = "Convert a selectable-text PDF into a Chrome-translatable HTML viewer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pymupdf>=1.24"]

[project.scripts]
pdf2read = "pdf2read.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf2read = ["viewer/*", "web/*"]
